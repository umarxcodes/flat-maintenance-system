<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Center Tower Primary Gradient -->
    <linearGradient id="centerTower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Left Tower Gradient -->
    <linearGradient id="leftTower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Right Tower Gradient -->
    <linearGradient id="rightTower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Golden Beacon / Sun Flare -->
    <linearGradient id="beaconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glass Reflection Accent -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Foundation Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Housing Container -->
  <rect
    x="1"
    y="1"
    width="62"
    height="62"
    rx="17"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="1.5"
  />

  <!-- Subtle Ambient Floor Grid / Foundation Line -->
  <path
    d="M10 50.5H54"
    stroke="#334155"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-opacity="0.7"
  />

  <!-- ----------------- LEFT TOWER (RESIDENTIAL WING) ----------------- -->
  <path
    d="M14 26L23 21V50H14V26Z"
    fill="url(#leftTower)"
    fill-opacity="0.9"
  />
  <path
    d="M14 26L23 21L23 20L14 25V26Z"
    fill="#BAE6FD"
  />
  <line x1="17" y1="28" x2="20" y2="28" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="17" y1="33" x2="20" y2="33" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="17" y1="38" x2="20" y2="38" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="17" y1="43" x2="20" y2="43" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />

  <!-- ----------------- RIGHT TOWER (EXECUTIVE SUITES) ----------------- -->
  <path
    d="M41 29L50 24V50H41V29Z"
    fill="url(#rightTower)"
    fill-opacity="0.9"
  />
  <path
    d="M41 29L50 24L50 23L41 28V29Z"
    fill="#DDD6FE"
  />
  <line x1="44" y1="31" x2="47" y2="31" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="44" y1="36" x2="47" y2="36" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="44" y1="41" x2="47" y2="41" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
  <line x1="44" y1="46" x2="47" y2="46" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />

  <!-- ----------------- CENTER MASTER TOWER (MAIN HEADQUARTERS) ----------------- -->
  <path
    d="M25 15L32 10L39 15V50H25V15Z"
    fill="url(#centerTower)"
  />
  <path
    d="M25 15L32 10V50H25V15Z"
    fill="url(#glassReflect)"
  />
  <line
    x1="32"
    y1="10"
    x2="32"
    y2="50"
    stroke="#FFFFFF"
    stroke-width="1"
    stroke-opacity="0.35"
  />

  <!-- Master Center Tower Windows (Grid Pattern) -->
  <rect x="27.5" y="19" width="3" height="2.5" rx="0.5" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="33.5" y="19" width="3" height="2.5" rx="0.5" fill="#38BDF8" fill-opacity="0.9" />
  <rect x="27.5" y="24" width="3" height="2.5" rx="0.5" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="33.5" y="24" width="3" height="2.5" rx="0.5" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="27.5" y="29" width="3" height="2.5" rx="0.5" fill="#38BDF8" fill-opacity="0.9" />
  <rect x="33.5" y="29" width="3" height="2.5" rx="0.5" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="27.5" y="34" width="3" height="2.5" rx="0.5" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="33.5" y="34" width="3" height="2.5" rx="0.5" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Grand Portico / Entrance Atrium -->
  <path
    d="M29.5 42H34.5V50H29.5V42Z"
    fill="#0B132B"
  />
  <path
    d="M30.5 44H33.5V50H30.5V44Z"
    fill="#38BDF8"
    fill-opacity="0.8"
  />

  <!-- ----------------- SMART CROWN BEACON / SATELLITE SPIRE ----------------- -->
  <line x1="32" y1="10" x2="32" y2="6.5" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="32" cy="5.5" r="2" fill="url(#beaconGlow)" filter="url(#softGlow)" />
  <circle cx="32" cy="5.5" r="0.8" fill="#FFFFFF" />

  <!-- Ambient Signal Waves (Pulse) -->
  <path
    d="M27 6C28.2 4.8 30 4 32 4C34 4 35.8 4.8 37 6"
    stroke="#38BDF8"
    stroke-width="1"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />
</svg>